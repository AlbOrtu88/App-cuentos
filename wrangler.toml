name = "cuentos-magicos"
main = "src/index.js"
compatibility_date = "2026-03-01"

# La PWA se sirve desde la misma dirección que la API, así no hace falta CORS.
[assets]
directory = "./public"
binding = "ASSETS"

# Plan, cuota y cuentos de cada usuario.
# Crear con: npx wrangler kv namespace create DATA  y pegar aquí el id.
[[kv_namespaces]]
binding = "DATA"
id = "REEMPLAZAR_CON_ID_DE_KV"

# Imágenes y audios generados.
# Crear con: npx wrangler r2 bucket create cuentos-magicos-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cuentos-magicos-media"

# Catálogo anónimo de cuentos para los libros de KDP (opcional: sin él no se guarda nada).
# Crear con: npx wrangler d1 create cuentos-catalogo  y pegar aquí el id.
# Tabla: npx wrangler d1 migrations apply cuentos-catalogo --remote
[[d1_databases]]
binding = "CATALOG"
database_name = "cuentos-catalogo"
database_id = "REEMPLAZAR_CON_ID_DE_D1"
migrations_dir = "migrations"

# Tarea diaria: borra las voces que el plan ya no cubre y los cuentos que salen de la biblioteca.
[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"
# Voz de Google Chirp 3 HD en español de España.
TTS_VOICE = "es-ES-Chirp3-HD-Aoede"
# Modelo de las ilustraciones. "gemini-3.1-flash-lite-image" ≈ 0,034 $ por imagen, acuarela detallada.
# Pon "flux" para volver a FLUX schnell en fal.ai (≈ 0,0015 $, menos detalle).
IMAGE_MODEL = "gemini-3.1-flash-lite-image"
# Límites anti-abuso. Los minutos de voz de cada plan están en src/config.js.
FREE_DAILY_IP_LIMIT = "10"
PAID_DAILY_LIMIT = "5"
# Pon "1" cuando tengas creados los precios de Pro y VIP en Stripe para poder venderlos.
VOICE_PLANS_ENABLED = "0"
# Precios de Stripe (ids price_...). Rellenar al crear los productos.
PRICE_STANDARD_MONTHLY = ""
PRICE_STANDARD_ANNUAL = ""
PRICE_PRO_MONTHLY = ""
PRICE_PRO_ANNUAL = ""
PRICE_VIP_MONTHLY = ""
PRICE_VIP_ANNUAL = ""

# Secretos (no van en este archivo):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GOOGLE_TTS_API_KEY
#   npx wrangler secret put FAL_KEY
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put MEDIA_SIGNING_KEY   (texto aleatorio largo: firma los enlaces de las muestras de voz)
#   npx wrangler secret put ADMIN_TOKEN         (texto aleatorio largo: descarga del catálogo para los libros)
#
# Solo en local (.dev.vars), nunca en producción:
#   MOCK_AI=1          cuentos de prueba sin gastar en IA
#   DEV_PLAN=vip       simula un plan sin pasar por Stripe
#   ENVIRONMENT=development
