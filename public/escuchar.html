<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Un cuento para ti · Cuentos Mágicos</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 font-sans antialiased">
  <div class="w-full max-w-md mx-auto my-2 space-y-4">
    <header class="text-center">
      <h1 class="text-xl font-bold tracking-tight text-amber-300">🌙 Cuentos Mágicos</h1>
      <p class="text-xs text-slate-400 mt-0.5">Te han enviado el cuento de esta noche</p>
    </header>

    <p id="shared-loading" class="text-center text-xs text-slate-400 py-10">Abriendo el cuento...</p>
    <p id="shared-error" class="hidden text-center text-sm text-slate-300 bg-slate-900 border border-slate-800 rounded-3xl p-6"></p>

    <article id="shared-story" class="hidden bg-stone-900 border border-stone-800 rounded-3xl p-6 shadow-2xl space-y-5 text-stone-200">
      <h2 id="shared-title" class="text-xl font-bold text-amber-100 text-center leading-snug"></h2>
      <button id="shared-play" type="button" class="hidden w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-2xl text-base">▶ Escuchar el cuento</button>
      <audio id="shared-audio" controls preload="none" class="hidden w-full"></audio>
      <div id="shared-image-box" class="hidden w-full aspect-[4/3] bg-stone-950 rounded-2xl overflow-hidden border border-stone-800">
        <img id="shared-image" alt="Ilustración del cuento" class="w-full h-full object-cover">
      </div>
      <div id="shared-content" class="text-lg font-serif leading-relaxed text-stone-300 space-y-4"></div>
    </article>

    <footer class="text-center text-[11px] text-slate-500 pb-4">
      Cuentos personalizados para dormir · <a href="/" class="underline">Crea el tuyo</a> · <a href="/privacidad.html" class="underline">Privacidad</a>
    </footer>
  </div>
  <script src="/escuchar.js"></script>
</body>
</html>
